<!doctype html>
<html lang="en">
  <head><meta charset="utf-8" /><title>pipeline cache storage probe</title></head>
  <body>
    <script>
      const key = new URLSearchParams(location.search).get("key");
      parent.postMessage(
        { type: "wgpu-fft-storage-probe", key, value: key ? localStorage.getItem(key) : null },
        location.origin,
      );
    </script>
  </body>
</html>
