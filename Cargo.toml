[workspace]
members = ["wgpu-nufft", "wgpu-web"]
default-members = [".", "wgpu-nufft", "wgpu-web"]
resolver = "2"

[package]
name = "wgpu-fft"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
license = "Apache-2.0"
description = "GPU FFT library for Rust on wgpu/WebGPU: C2C f32, native f64, and portable double-float plus real f32 transforms over 1D/ND shapes, native and WebAssembly, with structured diagnostics and tuning."
repository = "https://github.com/MaximEremenko/wgpuFFT"
readme = "README.md"
keywords = ["fft", "wgpu", "webgpu", "gpu", "dsp"]
categories = ["mathematics", "algorithms", "wasm"]

[lib]
name = "wgpu_fft"
path = "src/lib.rs"

[features]
default = []
serde = ["dep:serde", "dep:serde_json"]

[dependencies]
bytemuck = { version = "1.22", features = ["derive"] }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
wgpu = "29.0.1"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
pollster = "0.4"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
futures-channel = "0.3"
wasm-bindgen-test = "=0.3.70"

[[bench]]
name = "fft_bench"
harness = false
