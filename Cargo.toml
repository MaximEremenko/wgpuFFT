[workspace]
resolver = "2"
members = ["wgpu-fft-web"]

[package]
publish = false
name = "wgpu-fft"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
license = "Apache-2.0"
description = "GPU FFT library for Rust on wgpu/WebGPU: C2C f32, native f64, and portable double-float plus real f32 transforms over 1D/ND shapes, native and WebAssembly, with structured diagnostics and tuning."
repository = "https://github.com/MaximEremenko/wgpuFFT"
readme = "README.md"
keywords = ["fft", "wgpu", "webgpu", "gpu", "dsp"]
categories = ["mathematics", "algorithms", "wasm"]

[lib]
name = "wgpu_fft"
path = "src/lib.rs"

[features]
default = ["cpu"]
cpu = ["dep:num-complex", "dep:realfft", "dep:rustfft"]
serde = ["dep:serde", "dep:serde_json"]

[dependencies]
bytemuck = { version = "1.22", features = ["derive"] }
num-complex = { version = "0.4", features = ["bytemuck"], optional = true }
realfft = { version = "3.5", optional = true }
rustfft = { version = "6.4", optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
wgpu = "30.0.1"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
pollster = "0.4"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
futures-channel = "0.3"
wasm-bindgen-test = "=0.3.79"

[[bench]]
name = "fft_bench"
harness = false

# Checks the long-axis kernels against the CPU backend.
[[test]]
name = "gpu_long_axes"
required-features = ["cpu"]
