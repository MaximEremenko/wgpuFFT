[package]
name = "wgpu-nufft"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
description = "Portable GPU NUFFT plans built on wgpu-fft."
readme = "README.md"

[features]
default = []
gpu-profiling = []
type1-2d-tile-prototype = []
type1-3d-tile-prototype = []

[lib]
name = "wgpu_nufft"
path = "src/lib.rs"

[dependencies]
bytemuck = "1.22"
wgpu = "29.0.1"
wgpu-fft = { path = "..", version = "0.1.0" }

[dev-dependencies]
pollster = "0.4"

[[bench]]
name = "nufft_bench"
harness = false

[[bench]]
name = "nufft_2d_bench"
harness = false

[[bench]]
name = "nufft_stage_profile"
harness = false
required-features = ["gpu-profiling"]
