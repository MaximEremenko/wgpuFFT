[package]
name = "wgpu-fft"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
description = "Early Rust wgpu FFT library scaffold with C2C f32 support."

[lib]
name = "wgpu_fft"
path = "src/lib.rs"

[dependencies]
bytemuck = { version = "1.22", features = ["derive"] }
wgpu = "29.0.1"

[dev-dependencies]
pollster = "0.4"
